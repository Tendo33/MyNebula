name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-lint:
    name: Backend Lint (Ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Ruff check
        run: uv run ruff check src tests scripts alembic

      - name: Ruff format check
        run: uv run ruff format --check src tests scripts alembic

  backend-test:
    name: Backend Unit Tests
    runs-on: ubuntu-latest
    needs: backend-lint
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mynebula
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mynebula
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mynebula"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen --all-extras

      - name: Verify database migrations
        run: uv run alembic upgrade head

      - name: Run unit tests
        run: uv run pytest -q -m "not integration"

      # Separate step on purpose: the integration tier auto-skips when no test
      # database is reachable, and a skip folded into the unit run would vanish
      # into the summary as a false green. As its own step, pytest exits 5 on
      # "no tests collected", which fails the job.
      - name: Run integration tests
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mynebula_test
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -c 'CREATE DATABASE mynebula_test'
          uv run pytest -q -m integration

      - name: Audit Python dependencies
        run: |
          uv export --frozen --all-extras --no-hashes --no-emit-project --format requirements-txt --output-file /tmp/mynebula-requirements.txt
          uvx pip-audit -r /tmp/mynebula-requirements.txt --disable-pip --no-deps

  frontend-lint:
    name: Frontend Lint & Typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript typecheck
        run: pnpm exec tsc --noEmit

      - name: ESLint
        run: pnpm run lint

      - name: Audit production dependencies
        run: pnpm audit --prod

  frontend-test:
    name: Frontend Unit Tests
    runs-on: ubuntu-latest
    needs: frontend-lint
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm run test

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    needs: frontend-lint
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

  e2e:
    name: End-to-End (Playwright)
    runs-on: ubuntu-latest
    needs: frontend-build
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Chromium only: installing every browser triples the job for no signal.
      # Invoked through the project's own @playwright/test CLI: `pnpm exec
      # playwright` can resolve to a different playwright-core and then install
      # a browser revision the test runner does not use.
      - name: Install Playwright browser
        run: node node_modules/@playwright/test/cli.js install --with-deps chromium

      - name: Run Playwright suite
        env:
          RUN_E2E: '1'
        run: pnpm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7
          if-no-files-found: ignore

  container-build:
    name: Container Build
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test, frontend-build]
    steps:
      - uses: actions/checkout@v4

      - name: Build production image
        run: docker build --tag mynebula:ci .

      # Assert against the built image. `docker build` succeeding does not prove
      # the copied virtualenv works, and reading the Dockerfile does not prove
      # the toolchain is gone.
      - name: Assert runtime image contains no build toolchain
        run: |
          test "$(docker run --rm mynebula:ci sh -c 'command -v gcc || echo absent')" = absent
          test "$(docker run --rm mynebula:ci sh -c 'command -v g++ || echo absent')" = absent
          docker run --rm mynebula:ci sh -c 'command -v curl'
          test "$(docker run --rm mynebula:ci id -un)" = appuser
          docker run --rm mynebula:ci python -c 'import nebula.main'
